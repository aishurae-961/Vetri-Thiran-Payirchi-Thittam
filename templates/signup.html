<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - PocketSmart AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f5f2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            min-height: 560px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 45px rgba(0,0,0,0.12);
        }

        .left {
            width: 50%;
            background: linear-gradient(135deg, #d8c2a4, #f1e6d5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 50px;
        }

        .logo span {
            color: #b88a44;
        }

        .emoji {
            font-size: 75px;
            margin-bottom: 25px;
        }

        .left h1 {
            font-size: 45px;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .left p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
        }

        .right {
            width: 50%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #b88a44;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .login {
            text-align: center;
            margin-top: 25px;
            color: #777;
        }

        .login a {
            color: #b07b32;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            text-align: center;
            margin-top: 20px;
        }

        .home a {
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 750px) {

            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 40px;
                text-align: center;
            }

            .left h1 {
                font-size: 35px;
            }

            .right {
                padding: 40px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">

        <div class="logo">
            Pocket<span>Smart</span> AI
        </div>

        <div class="emoji">
            ✨
        </div>

        <h1>
            Start Your<br>
            Smart Journey!
        </h1>

        <p>
            Create your account and start getting
            personalized budget recommendations.
        </p>

    </div>


    <div class="right">

        <h2>
            Create Account
        </h2>

        <p class="subtitle">
            Sign up to get started with PocketSmart AI.
        </p>

        <form action="/signup" method="post">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">
                Create Account →
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="/login">Login</a>
        </div>

        <div class="home">
            <a href="/">← Back to Home</a>
        </div>

    </div>

</div>

</body>
</html>
